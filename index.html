<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rozana – Daily Paper for SSC, Banking & UPSC</title>
<meta name="description" content="One free daily paper for government exam aspirants: a word puzzle, 5 GS questions with SSC marking and a reasoning question. In English and Hindi.">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<meta property="og:description" content="Word puzzle + GS + Reasoning. One paper a day. Keep your streak.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single-column exam paper. Parts A, B, C run in order, OMR-style answer bubbles, a result slip at the end. */
:root{
  --paper:#F3F5FA; --surface:#FFFFFF; --ink:#16213D; --muted:#5A6482; --line:#D8DDEA;
  --omr:#C2343F; --omr-soft:#FBE8EA;
  --ok:#1F7A4D; --ok-soft:#E2F3E9; --bad:#B42318; --bad-soft:#FDECEA;
  --warn:#B07A12; --absent:#8A91A8; --on-state:#FFFFFF;
  --f-display:"Rozha One", "Noto Serif Devanagari", Georgia, serif;
  --f-body:"Mukta", "Noto Sans Devanagari", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1424; --surface:#161E33; --ink:#E8ECF6; --muted:#9AA3BD; --line:#2A3452;
  --omr:#F0646F; --omr-soft:#3A1A24; --ok:#4CC38A; --ok-soft:#14301F; --bad:#F2766B; --bad-soft:#3A1C1A;
  --warn:#E3B04B; --absent:#4A536E; --on-state:#0E1424; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1424; --surface:#161E33; --ink:#E8ECF6; --muted:#9AA3BD; --line:#2A3452;
  --omr:#F0646F; --omr-soft:#3A1A24; --ok:#4CC38A; --ok-soft:#14301F; --bad:#F2766B; --bad-soft:#3A1C1A;
  --warn:#E3B04B; --absent:#4A536E; --on-state:#0E1424; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--omr);outline-offset:2px}

/* Masthead */
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.brand{font-family:var(--f-display);font-size:2.4rem;line-height:1;margin:0;color:var(--omr)}
.brand small{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip b{color:var(--omr)}
.lang{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:4px 12px;font-size:.85rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sample{font-size:.8rem;color:var(--muted);margin:0}

/* Progress */
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{font-size:.8rem;border-top:4px solid var(--line);padding-top:6px;color:var(--muted)}
.step.done{border-color:var(--ok);color:var(--ink)}

/* Parts */
.part{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.part-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.part h2{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0;line-height:1.2}
.part h2 span{color:var(--omr);margin-right:8px}
.hint{font-size:.85rem;color:var(--muted)}
.clue{background:var(--omr-soft);border-radius:8px;padding:10px 12px;font-size:.95rem}
.clue b{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--omr);display:block}

/* Word puzzle */
.grid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;justify-content:center}
.row{display:grid;grid-template-columns:repeat(5,52px);gap:6px}
.tile{width:52px;height:52px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:1.4rem;border-radius:6px;text-transform:uppercase}
.tile.filled{border-color:var(--muted)}
.tile.correct{background:var(--ok);border-color:var(--ok);color:var(--on-state)}
.tile.present{background:var(--warn);border-color:var(--warn);color:var(--on-state)}
.tile.absent{background:var(--absent);border-color:var(--absent);color:var(--on-state)}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center}
.kb-row{display:flex;gap:4px;width:100%;justify-content:center}
.key{flex:1;max-width:40px;height:46px;border:0;border-radius:6px;background:var(--line);font-family:var(--f-mono);font-weight:700;font-size:.85rem;padding:0}
.key.wide{max-width:64px;flex:1.5;font-size:.7rem}
.key.correct{background:var(--ok);color:var(--on-state)}
.key.present{background:var(--warn);color:var(--on-state)}
.key.absent{background:var(--absent);color:var(--on-state)}
.msg{min-height:1.5em;text-align:center;font-weight:500}

/* MCQ */
.q{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q-top{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.qno{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--omr);border:1px solid currentColor;border-radius:4px;padding:0 6px}
.q p{margin:0;font-weight:500;font-size:1.02rem}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.bubble{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--omr);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;color:var(--omr)}
.opt.picked .bubble{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bubble{background:var(--ok);border-color:var(--ok);color:var(--on-state)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bubble{background:var(--bad);border-color:var(--bad);color:var(--on-state)}
.explain{font-size:.92rem;background:var(--paper);border-radius:8px;padding:10px 12px}
.explain b{color:var(--ok)}
.explain b.no{color:var(--bad)}
.marking{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}

/* Reasoning */
.series{font-family:var(--f-mono);font-size:1.5rem;font-weight:700;letter-spacing:.04em;text-align:center;overflow-x:auto;padding:6px 0}
.series .gap{color:var(--omr)}
.answer-row{display:flex;gap:8px;flex-wrap:wrap}
.answer-row input{flex:1;min-width:0;font:inherit;font-family:var(--f-mono);font-size:1.1rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.btn{border:0;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-weight:700}
.btn.accent{background:var(--omr);color:#fff}

/* Result slip */
.slip{border:2px solid var(--ink);border-radius:10px;padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:14px}
.slip h2{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.score{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column}
.score span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.score strong{font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.share-text{font-family:var(--f-mono);font-size:.85rem;white-space:pre;background:var(--paper);border-radius:8px;padding:12px;overflow-x:auto;margin:0}
.revise{margin:0;padding-left:20px;font-size:.92rem}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.countdown{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
@media (max-width:400px){.row{grid-template-columns:repeat(5,46px)}.tile{width:46px;height:46px}.brand{font-size:2rem}}
@media (prefers-reduced-motion:no-preference){.tile.flip{animation:flip .35s ease}@keyframes flip{50%{transform:scaleY(.1)}}}
body{margin:0}
.sitefoot{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:.85rem;color:var(--muted);padding-top:8px}
.sitefoot a{color:var(--muted)}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <h1 class="brand">Rozana<small data-t="tagline"></small></h1>
    <div class="meta">
      <span class="chip" id="paperNo"></span>
      <span class="chip"><span data-t="streak"></span> <b id="streak">0</b></span>
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-en" aria-pressed="true">EN</button>
        <button id="lang-hi" aria-pressed="false">हिं</button>
      </div>
    </div>
  </header>
  <p class="sample" data-t="sample"></p>

  <div class="progress">
    <div class="step" id="st-a"></div><div class="step" id="st-b"></div><div class="step" id="st-c"></div>
  </div>

  <section class="part" id="partA">
    <div class="part-head"><h2><span>A</span><span data-t="aTitle" style="color:inherit;margin:0"></span></h2><span class="hint" data-t="aHint"></span></div>
    <div class="clue"><b data-t="clue"></b><span id="wClue"></span></div>
    <div class="grid" id="grid"></div>
    <div class="msg" id="wMsg" aria-live="polite"></div>
    <div class="kb" id="kb"></div>
  </section>

  <section class="part" id="partB">
    <div class="part-head"><h2><span>B</span><span data-t="bTitle" style="color:inherit;margin:0"></span></h2><span class="marking" data-t="marking"></span></div>
    <div id="mcqs"></div>
  </section>

  <section class="part" id="partC">
    <div class="part-head"><h2><span>C</span><span data-t="cTitle" style="color:inherit;margin:0"></span></h2><span class="hint" data-t="cHint"></span></div>
    <p style="margin:0;font-weight:500" id="rQ"></p>
    <div class="series" id="rSeries"></div>
    <form class="answer-row" id="rForm">
      <input id="rInput" inputmode="numeric" autocomplete="off" aria-label="Answer">
      <button class="btn" type="submit" data-t="check"></button>
    </form>
    <div id="rOut"></div>
  </section>

  <section class="slip" id="slip" hidden>
    <h2 data-t="slipTitle"></h2>
    <div class="scores">
      <div class="score"><span data-t="aShort"></span><strong id="sA"></strong></div>
      <div class="score"><span data-t="bShort"></span><strong id="sB"></strong></div>
      <div class="score"><span data-t="cShort"></span><strong id="sC"></strong></div>
    </div>
    <div id="reviseBox"></div>
    <pre class="share-text" id="shareText"></pre>
    <div class="foot">
      <button class="btn accent" id="copyBtn" data-t="share"></button>
      <span class="countdown"><span data-t="next"></span> <span id="cd"></span></span>
    </div>
  </section>
  <footer class="sitefoot"><a href="/about.html">About</a><a href="/privacy.html">Privacy</a><span>© 2026 Rozana</span></footer>
</div>

<script>
const T = {
  en:{tagline:"One paper a day for SSC · Banking · UPSC",streak:"Streak",sample:"A new paper every day at midnight IST.",
    aTitle:"Word of the day",aHint:"6 tries · 5 letters",clue:"Clue",bTitle:"General Studies",marking:"+2 right · −0.5 wrong (SSC pattern)",
    cTitle:"Reasoning",cHint:"One attempt",check:"Check",slipTitle:"Your result slip",aShort:"Word",bShort:"GS",cShort:"Reasoning",
    share:"Copy result for WhatsApp",copied:"Copied. Paste it in your group.",next:"Next paper in",explain:"Explanation",right:"Correct.",wrong:"Not quite.",
    revise:"Revise these topics",allRight:"Full marks in GS today.",notWord:"Type all 5 letters",won:"Solved!",lost:"Answer:",paper:"Paper",
    stepA:"A · Word",stepB:"B · GS",stepC:"C · Reasoning",rQ:"Which number comes next in the series?",ans:"Answer"},
  hi:{tagline:"SSC · बैंकिंग · UPSC के लिए रोज़ एक पेपर",streak:"लगातार दिन",sample:"हर दिन रात 12 बजे (IST) नया पेपर।",
    aTitle:"आज का शब्द",aHint:"6 प्रयास · 5 अक्षर",clue:"संकेत",bTitle:"सामान्य अध्ययन",marking:"+2 सही · −0.5 गलत (SSC पैटर्न)",
    cTitle:"तर्कशक्ति",cHint:"एक प्रयास",check:"जाँचें",slipTitle:"आपकी परिणाम पर्ची",aShort:"शब्द",bShort:"सा. अध्ययन",cShort:"तर्कशक्ति",
    share:"WhatsApp के लिए परिणाम कॉपी करें",copied:"कॉपी हो गया। अपने ग्रुप में पेस्ट करें।",next:"अगला पेपर",explain:"व्याख्या",right:"सही।",wrong:"गलत।",
    revise:"इन विषयों को दोहराएँ",allRight:"आज सामान्य अध्ययन में पूरे अंक।",notWord:"पाँचों अक्षर लिखें",won:"हल हो गया!",lost:"उत्तर:",paper:"पेपर",
    stepA:"A · शब्द",stepB:"B · सा. अध्ययन",stepC:"C · तर्कशक्ति",rQ:"श्रृंखला में अगली संख्या क्या होगी?",ans:"उत्तर"}
};
let PAPER_NO,WORD,CLUE,MCQ,SERIES,SERIES_ANS,SERIES_X;

const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const istKey = (offsetDays=0)=>{const d=new Date(Date.now()+5.5*36e5+offsetDays*864e5);return d.toISOString().slice(0,10)};
const SKEY = "rozana-"+istKey();
let S = Object.assign({lang:"en",guesses:[],cur:"",wDone:false,wWon:false,picks:[null,null,null,null,null],rAns:null},store.get(SKEY)||{});
S.lang = (store.get("rozana-lang")) || S.lang;
const save=()=>store.set(SKEY,S);
const t=k=>T[S.lang][k];
const $=id=>document.getElementById(id);

function scoreGuess(g,a){
  const r=Array(5).fill("absent"),c={};
  for(let i=0;i<5;i++){if(g[i]===a[i])r[i]="correct";else c[a[i]]=(c[a[i]]||0)+1}
  for(let i=0;i<5;i++){if(r[i]!=="correct"&&c[g[i]]>0){r[i]="present";c[g[i]]--}}
  return r;
}

function renderText(){
  document.documentElement.lang=S.lang==="hi"?"hi":"en";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("lang-en").setAttribute("aria-pressed",S.lang==="en");$("lang-hi").setAttribute("aria-pressed",S.lang==="hi");
  const date=new Date().toLocaleDateString(S.lang==="hi"?"hi-IN":"en-IN",{day:"numeric",month:"short",timeZone:"Asia/Kolkata"});
  $("paperNo").textContent=`${t("paper")} #${PAPER_NO} · ${date}`;
  $("wClue").textContent=CLUE[S.lang];
  $("rQ").textContent=t("rQ");
}

/* Part A */
function renderGrid(flipRow=-1){
  const g=$("grid");g.innerHTML="";
  for(let r=0;r<6;r++){
    const row=document.createElement("div");row.className="row";
    const word=r<S.guesses.length?S.guesses[r]:(r===S.guesses.length&&!S.wDone?S.cur:"");
    const res=r<S.guesses.length?scoreGuess(S.guesses[r],WORD):null;
    for(let c=0;c<5;c++){
      const tl=document.createElement("div");tl.className="tile";
      const ch=word[c]||"";tl.textContent=ch;
      if(ch)tl.classList.add("filled");
      if(res){tl.classList.add(res[c]);if(r===flipRow){tl.classList.add("flip");tl.style.animationDelay=c*80+"ms"}}
      row.appendChild(tl);
    }
    g.appendChild(row);
  }
  renderKB();
  if(S.wDone)$("wMsg").textContent=S.wWon?`${t("won")} ${S.guesses.length}/6`:`${t("lost")} ${WORD}`;
}
function renderKB(){
  const st={};const rank={absent:1,present:2,correct:3};
  S.guesses.forEach(g=>scoreGuess(g,WORD).forEach((r,i)=>{if(!st[g[i]]||rank[r]>rank[st[g[i]]])st[g[i]]=r}));
  const kb=$("kb");kb.innerHTML="";
  ["QWERTYUIOP","ASDFGHJKL","↵ZXCVBNM⌫"].forEach(line=>{
    const row=document.createElement("div");row.className="kb-row";
    [...line].forEach(k=>{
      const b=document.createElement("button");b.className="key";b.type="button";
      if(k==="↵"){b.textContent="ENTER";b.classList.add("wide");b.onclick=()=>press("ENTER")}
      else if(k==="⌫"){b.textContent="⌫";b.classList.add("wide");b.setAttribute("aria-label","Backspace");b.onclick=()=>press("BACK")}
      else{b.textContent=k;if(st[k])b.classList.add(st[k]);b.onclick=()=>press(k)}
      b.disabled=S.wDone;row.appendChild(b);
    });
    kb.appendChild(row);
  });
}
function press(k){
  if(S.wDone)return;
  $("wMsg").textContent="";
  if(k==="BACK")S.cur=S.cur.slice(0,-1);
  else if(k==="ENTER"){
    if(S.cur.length<5){$("wMsg").textContent=t("notWord");return}
    S.guesses.push(S.cur);S.cur="";
    if(S.guesses.at(-1)===WORD){S.wDone=true;S.wWon=true}
    else if(S.guesses.length===6){S.wDone=true}
    save();renderGrid(S.guesses.length-1);afterChange();return;
  }
  else if(S.cur.length<5)S.cur+=k;
  save();renderGrid();
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Enter")press("ENTER");else if(e.key==="Backspace")press("BACK");
  else if(/^[a-zA-Z]$/.test(e.key))press(e.key.toUpperCase());
});

/* Part B */
function renderMCQ(){
  const box=$("mcqs");box.innerHTML="";
  MCQ.forEach((m,i)=>{
    const q=document.createElement("div");q.className="q";
    const pick=S.picks[i];
    q.innerHTML=`<div class="q-top"><span class="qno">Q${i+1} / ${MCQ.length}</span><span class="tag">${m.tag[S.lang]}</span></div><p>${m.q[S.lang]}</p>`;
    const opts=document.createElement("div");opts.className="opts";
    m.o[S.lang].forEach((o,j)=>{
      const b=document.createElement("button");b.className="opt";b.type="button";
      b.innerHTML=`<span class="bubble">${"ABCD"[j]}</span><span>${o}</span>`;
      if(pick!==null){b.disabled=true;if(j===m.ans)b.classList.add("right");else if(j===pick)b.classList.add("wrong")}
      b.onclick=()=>{S.picks[i]=j;save();renderMCQ();afterChange()};
      opts.appendChild(b);
    });
    q.appendChild(opts);
    if(pick!==null){
      const ok=pick===m.ans;const x=document.createElement("div");x.className="explain";
      x.innerHTML=`<b class="${ok?"":"no"}">${ok?t("right"):t("wrong")}</b> ${m.x[S.lang]}`;
      q.appendChild(x);
    }
    box.appendChild(q);
  });
}

/* Part C */
function renderR(){
  $("rSeries").innerHTML=SERIES.join(", ")+`, <span class="gap">?</span>`;
  const done=S.rAns!==null;
  $("rInput").disabled=done;$("rForm").querySelector("button").disabled=done;
  if(done)$("rInput").value=S.rAns;
  $("rOut").innerHTML=done?`<div class="explain"><b class="${S.rAns===SERIES_ANS?"":"no"}">${S.rAns===SERIES_ANS?t("right"):t("wrong")+" "+t("ans")+": "+SERIES_ANS+"."}</b> ${SERIES_X[S.lang]}</div>`:"";
}
$("rForm").addEventListener("submit",e=>{
  e.preventDefault();const v=parseInt($("rInput").value,10);
  if(Number.isNaN(v))return;S.rAns=v;save();renderR();afterChange();
});

/* Progress, streak, result slip */
const aDone=()=>S.wDone, bDone=()=>S.picks.every(p=>p!==null), cDone=()=>S.rAns!==null;
function gsScore(){return S.picks.reduce((s,p,i)=>p===null?s:s+(p===MCQ[i].ans?2:-0.5),0)}
function updateStreak(){
  const st=store.get("rozana-streak")||{last:null,count:0};
  if(st.last===istKey())return st.count;
  st.count=st.last===istKey(-1)?st.count+1:1;st.last=istKey();store.set("rozana-streak",st);return st.count;
}
function currentStreak(){const st=store.get("rozana-streak");if(!st)return 0;return(st.last===istKey()||st.last===istKey(-1))?st.count:0}
function afterChange(){
  [["st-a",aDone,"stepA"],["st-b",bDone,"stepB"],["st-c",cDone,"stepC"]].forEach(([id,f,k])=>{$(id).textContent=t(k);$(id).classList.toggle("done",f())});
  let streak=currentStreak();
  const all=aDone()&&bDone()&&cDone();
  if(all)streak=updateStreak();
  $("streak").textContent=streak;
  $("slip").hidden=!all;
  if(!all)return;
  $("sA").textContent=S.wWon?`${S.guesses.length}/6`:"X/6";
  $("sB").textContent=`${gsScore().toFixed(1)}/10`;
  $("sC").textContent=S.rAns===SERIES_ANS?"1/1":"0/1";
  const wrongTopics=[...new Set(MCQ.filter((m,i)=>S.picks[i]!==m.ans).map(m=>m.tag[S.lang]))];
  $("reviseBox").innerHTML=wrongTopics.length?`<b>${t("revise")}</b><ul class="revise">${wrongTopics.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<b style="color:var(--ok)">${t("allRight")}</b>`;
  const emo={correct:"🟩",present:"🟨",absent:"⬜"};
  const grid=S.guesses.map(g=>scoreGuess(g,WORD).map(r=>emo[r]).join("")).join("\n");
  const date=new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short",timeZone:"Asia/Kolkata"});
  $("shareText").textContent=
`Rozana #${PAPER_NO} · ${date}
${t("aShort")} ${S.wWon?S.guesses.length:"X"}/6
${grid}
${t("bShort")} ${S.picks.map((p,i)=>p===MCQ[i].ans?"✅":"❌").join("")} ${gsScore().toFixed(1)}/10
${t("cShort")} ${S.rAns===SERIES_ANS?"✅":"❌"}
🔥 ${streak}`;
}
$("copyBtn").addEventListener("click",()=>{
  const txt=$("shareText").textContent;
  const done=()=>{$("copyBtn").textContent=t("copied")};
  const fallback=()=>{const r=document.createRange();r.selectNodeContents($("shareText"));const s=getSelection();s.removeAllRanges();s.addRange(r)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback)}else fallback();
});
function tick(){
  const ist=Date.now()+5.5*36e5;const d=new Date(ist);
  const ms=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+1)-ist;
  const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
  $("cd").textContent=[h,m,s].map(n=>String(n).padStart(2,"0")).join(":");
}
function setLang(l){S.lang=l;store.set("rozana-lang",l);save();renderAll()}
$("lang-en").onclick=()=>setLang("en");$("lang-hi").onclick=()=>setLang("hi");
function renderAll(){renderText();renderGrid();renderMCQ();renderR();afterChange()}
async function loadPaper(){
  let data=null;
  for(const name of [istKey(),"sample"]){
    try{const r=await fetch(`/papers/${name}.json`,{cache:"no-cache"});if(r.ok){data=await r.json();break}}catch(e){}
  }
  if(!data){document.querySelector(".wrap").insertAdjacentHTML("beforeend","<p class='sample'>Could not load today's paper. Check your connection and refresh.</p>");return}
  PAPER_NO=data.paper;WORD=data.word.answer.toUpperCase();CLUE=data.word.clue;MCQ=data.gs;
  SERIES=data.reasoning.series;SERIES_ANS=data.reasoning.answer;SERIES_X=data.reasoning.explain;
  S.picks=S.picks.length===MCQ.length?S.picks:MCQ.map(()=>null);
  renderAll();
}
loadPaper();tick();setInterval(tick,1000);
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}
</script>
</body>
